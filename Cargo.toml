[package]
name = "wav2flac"
version = "0.1.0"
edition = "2021"
description = "Convert WAV to FLAC with parallel block encoding"
readme = "README.md"

[[bin]]
name = "wav2flac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flacenc = { version = "0.5", default-features = false }
rayon = "1.10"

[dev-dependencies]
claxon = "0.4.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
